{{define "content"}}
<div class="max-w-5xl mx-auto px-4 py-8 space-y-6">
  <div>
    <h1 class="text-2xl font-semibold tracking-tight">Tool registry</h1>
    <p class="text-base-content/70 mt-1">
      {{len .Tools}} tools exposed over HTTP. POST <code>/api/tools/&lt;name&gt;</code>
      with JSON, or hit <code>/htmx/tool/&lt;name&gt;</code> for HTML.
    </p>
  </div>
  <div class="grid gap-4 md:grid-cols-2">
    {{range .Tools}}
    <div class="card bg-base-200">
      <div class="card-body gap-3">
        <h2 class="card-title font-mono text-base">{{.Name}}</h2>
        <p class="text-base-content/80">{{.Summary}}</p>
        {{if .Params}}
        <div class="flex flex-wrap gap-2">
          {{range .Params}}
          <span class="badge font-mono {{if .Required}}badge-warning{{else}}badge-outline{{end}}">
            {{.Name}}<span class="opacity-60">:{{.Type}}</span>
          </span>
          {{end}}
        </div>
        {{end}}
      </div>
    </div>
    {{end}}
  </div>
</div>
{{end}}
