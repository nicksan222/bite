{{define "content"}}
<div class="grid grid--2">
  {{range .Cards}}
  <section class="card">
    <header class="card__header">
      <h2 class="card__title">{{.Title}}</h2>
      <p class="card__desc">{{.Desc}}</p>
    </header>
    <div class="card__body">
      <button class="btn btn--outline btn--sm"
              hx-get="/htmx/tool/{{.Tool}}"
              hx-target="#out-{{.Tool}}"
              hx-swap="innerHTML"
              hx-indicator="#out-{{.Tool}}-spin">
        Refresh <span id="out-{{.Tool}}-spin" class="htmx-indicator muted">…</span>
      </button>
      <div id="out-{{.Tool}}" class="muted" style="margin-top:.75rem;font-size:.85rem;"
           hx-get="/htmx/tool/{{.Tool}}" hx-trigger="load" hx-swap="innerHTML">
        loading…
      </div>
    </div>
  </section>
  {{end}}
</div>
{{end}}
