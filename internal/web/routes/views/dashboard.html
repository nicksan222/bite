{{define "content"}}
<div class="max-w-5xl mx-auto px-4 py-8 space-y-6">
  <div>
    <h1 class="text-2xl font-semibold tracking-tight">Dashboard</h1>
    <p class="text-base-content/70 mt-1">Live snapshots of your day, week, and goals.</p>
  </div>
  <div class="grid gap-4 md:grid-cols-2">
    {{range .Cards}}
    <div class="card bg-base-200">
      <div class="card-body gap-3">
        <div class="space-y-1">
          <h2 class="card-title">{{.Title}}</h2>
          <p class="text-base-content/70">{{.Desc}}</p>
        </div>
        <div hx-get="/htmx/tool/{{.Tool}}"
             hx-trigger="load, every 30s, refresh from:body"
             hx-swap="innerHTML">
          <span class="loading loading-dots loading-sm text-base-content/60"></span>
        </div>
      </div>
    </div>
    {{end}}
  </div>
</div>
{{end}}
