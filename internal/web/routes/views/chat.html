{{define "content"}}
<div class="max-w-3xl mx-auto px-4 flex flex-col" style="min-height: calc(100vh - 4rem)">

  <div id="chat-transcript" class="flex-1 flex flex-col gap-5 py-6" aria-live="polite">
    <div id="chat-empty" class="flex-1 flex flex-col items-center justify-center text-center gap-2 px-4">
      <h1 class="text-3xl font-semibold tracking-tight">What's on your plate?</h1>
      <p class="text-base-content/70 max-w-md">
        Ask anything about food, log a meal, or check your day.
      </p>
    </div>
  </div>

  <form id="chat-form"
        class="sticky bottom-4 mb-4 bg-base-200 border border-base-300 rounded-xl flex items-end gap-2 p-2 pl-4"
        autocomplete="off"
        hx-post="/api/chat"
        hx-target="#chat-transcript"
        hx-swap="beforeend"
        hx-on::before-request="document.getElementById('chat-empty')?.remove()"
        hx-on::after-request="if(event.detail.successful)this.reset()"
        hx-on::after-swap="window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'})">
    <label for="chat-input" class="sr-only">Message bite</label>
    <textarea id="chat-input" name="message" rows="1" required
              class="flex-1 resize-none bg-transparent border-none outline-none py-2 leading-snug placeholder:text-base-content/50"
              placeholder="Message bite…"
              hx-on:keydown="if(event.key==='Enter'&&!event.shiftKey&&!event.isComposing){event.preventDefault();this.form.requestSubmit()}"></textarea>
    <button id="chat-send" type="submit" class="btn btn-primary btn-sm">Send</button>
  </form>

</div>
<script src="/static/htmx-ext-sse.min.js" defer></script>
{{end}}
