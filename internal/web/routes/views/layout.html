{{define "layout"}}<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>bite — {{.Title}}</title>
  <!-- Treat 4xx/5xx responses as swap-able too. Our htmx and chat
       endpoints return HTML alerts on validation/tool failures, and
       htmx's default "swap only on 2xx/3xx" would drop them silently. -->
  <meta name="htmx-config" content='{"responseHandling":[{"code":"204","swap":false},{"code":"[23]..","swap":true},{"code":"[45]..","swap":true,"error":true}]}'>
  <!-- daisyUI's bare bundle only ships light + dark themes; themes.css
       adds every other built-in (night, dim, business, etc.) so changing
       data-theme above is enough to swap the look. -->
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css">
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css" rel="stylesheet" type="text/css">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="/static/styles.css">
  <script src="/static/htmx.min.js" defer></script>
</head>
<body class="min-h-screen flex flex-col bg-base-100 text-base-content">
  <header class="navbar bg-base-100 sticky top-0 z-30 px-4">
    <div class="max-w-5xl w-full mx-auto flex items-center gap-6">
      <a href="/" class="font-semibold tracking-tight text-base">bite</a>
      <nav class="ml-auto" aria-label="Primary">
        <ul class="menu menu-horizontal gap-1 text-sm p-0">
          <li><a href="/"          class="{{if eq .Active "chat"     }}menu-active{{end}}" {{if eq .Active "chat"     }}aria-current="page"{{end}}>Chat</a></li>
          <li><a href="/dashboard" class="{{if eq .Active "dashboard"}}menu-active{{end}}" {{if eq .Active "dashboard"}}aria-current="page"{{end}}>Dashboard</a></li>
          <li><a href="/meals"     class="{{if eq .Active "meals"    }}menu-active{{end}}" {{if eq .Active "meals"    }}aria-current="page"{{end}}>Meals</a></li>
          <li><a href="/tools"     class="{{if eq .Active "tools"    }}menu-active{{end}}" {{if eq .Active "tools"    }}aria-current="page"{{end}}>Tools</a></li>
        </ul>
      </nav>
    </div>
  </header>
  <main class="flex-1 w-full">
    {{template "content" .}}
  </main>
</body>
</html>{{end}}
