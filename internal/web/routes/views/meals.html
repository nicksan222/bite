{{define "content"}}
<div class="grid grid--2">
  <section class="card">
    <header class="card__header">
      <h2 class="card__title">Log a meal</h2>
      <p class="card__desc">Submits to /htmx/tool/log_meal — same tool as the CLI.</p>
    </header>
    <div class="card__body">
      <form class="form"
            hx-post="/htmx/tool/log_meal"
            hx-target="#log-result"
            hx-swap="innerHTML"
            hx-on::after-request="if(event.detail.successful)this.reset()">
        <label class="field">
          <span class="field__label">Title</span>
          <input class="input" name="title" placeholder="Pasta with pesto" required>
        </label>
        <div class="grid grid--macros">
          <label class="field">
            <span class="field__label">Calories</span>
            <input class="input" name="kcal" type="number" step="any">
          </label>
          <label class="field">
            <span class="field__label">Protein (g)</span>
            <input class="input" name="protein_g" type="number" step="any">
          </label>
          <label class="field">
            <span class="field__label">Carbs (g)</span>
            <input class="input" name="carbs_g" type="number" step="any">
          </label>
          <label class="field">
            <span class="field__label">Fat (g)</span>
            <input class="input" name="fat_g" type="number" step="any">
          </label>
        </div>
        <div class="row">
          <button type="submit" class="btn">Log meal</button>
          <span class="htmx-indicator muted">saving…</span>
        </div>
      </form>
      <div id="log-result" style="margin-top:1rem"></div>
    </div>
  </section>

  <section class="card">
    <header class="card__header">
      <h2 class="card__title">Today</h2>
      <p class="card__desc">
        Loaded by <code>hx-get</code> against /htmx/tool/meals_today, refreshed every 30s.
      </p>
    </header>
    <div class="card__body">
      <div hx-get="/htmx/tool/meals_today"
           hx-trigger="load, every 30s, refresh from:body"
           hx-swap="innerHTML"
           class="muted">
        loading…
      </div>
    </div>
  </section>
</div>
{{end}}
