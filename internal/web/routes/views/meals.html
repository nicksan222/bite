{{define "content"}}
<div class="max-w-5xl mx-auto px-4 py-8 space-y-6">
  <div>
    <h1 class="text-2xl font-semibold tracking-tight">Meals</h1>
    <p class="text-base-content/70 mt-1">Log a meal or check today's intake.</p>
  </div>

  <div class="grid gap-4 lg:grid-cols-2">

    <div class="card bg-base-200">
      <div class="card-body gap-4">
        <div class="space-y-1">
          <h2 class="card-title">Log a meal</h2>
          <p class="text-base-content/70">Submits to <code>/htmx/tool/log_meal</code>.</p>
        </div>
        <form class="flex flex-col gap-3"
              hx-post="/htmx/tool/log_meal"
              hx-target="#log-result"
              hx-swap="innerHTML"
              hx-on::after-request="if(event.detail.successful)this.reset()">
          <input type="text" name="title" placeholder="Title" required class="input w-full">
          <div class="grid grid-cols-2 gap-3">
            <input type="number" step="any" name="kcal"      placeholder="Calories"    class="input">
            <input type="number" step="any" name="protein_g" placeholder="Protein (g)" class="input">
            <input type="number" step="any" name="carbs_g"   placeholder="Carbs (g)"   class="input">
            <input type="number" step="any" name="fat_g"     placeholder="Fat (g)"     class="input">
          </div>
          <div class="flex justify-end">
            <button type="submit" class="btn btn-primary">Log meal</button>
          </div>
        </form>
        <div id="log-result" class="empty:hidden"></div>
      </div>
    </div>

    <div class="card bg-base-200">
      <div class="card-body gap-3">
        <div class="space-y-1">
          <h2 class="card-title">Today</h2>
          <p class="text-base-content/70">Refreshes every 30 seconds.</p>
        </div>
        <div hx-get="/htmx/tool/meals_today"
             hx-trigger="load, every 30s, refresh from:body"
             hx-swap="innerHTML">
          <span class="loading loading-dots loading-sm text-base-content/60"></span>
        </div>
      </div>
    </div>

  </div>
</div>
{{end}}
