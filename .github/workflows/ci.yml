name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      # sqlc-generated files are committed to git, so only Linux needs to
      # install sqlc and verify the checked-in output is up to date.
      # Windows/macOS skip these steps (saves ~4 min on Windows runners).
      - name: Install sqlc
        if: runner.os == 'Linux'
        run: go install github.com/sqlc-dev/sqlc/cmd/sqlc@latest

      - name: Generate sqlc code
        if: runner.os == 'Linux'
        shell: bash
        run: sqlc generate

      - name: Verify sqlc output is up to date
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if git ls-files --error-unmatch internal/db/sqlc >/dev/null 2>&1; then
            if ! git diff --quiet -- internal/db/sqlc; then
              echo "::error::sqlc output is out of date. Run 'sqlc generate' and commit the result."
              git --no-pager diff -- internal/db/sqlc
              exit 1
            fi
          fi

      - name: Build
        run: go build -v ./...

      - name: Test
        shell: bash
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload coverage
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: ignore

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      - uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64
          install-mode: goinstall

  goreleaser-check:
    name: GoReleaser config check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: check
